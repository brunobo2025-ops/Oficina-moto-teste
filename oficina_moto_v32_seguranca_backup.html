<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#182230;--muted:#6c7787;--line:#e5e9ef;--accent:#e45a24;--accent2:#fff0e9;--nav:#151b25;--green:#16835d;--red:#c43d43;--shadow:0 8px 24px #1720330b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:24px 15px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);display:grid;place-items:center;font-size:22px}.brand b{display:block;font-size:17px}.brand small{color:#aeb7c5}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#c7ced9;text-align:left;padding:12px 13px;border-radius:10px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff15;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.nav span{width:21px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #ffffff20;padding:16px 10px;color:#aeb7c5;font-size:12px}.main{min-width:0}.top{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:15px}.crumb{color:var(--muted);font-size:13px}.top h1{font-size:20px;margin:2px 0 0}.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{background:var(--accent2);color:var(--accent);font-weight:800;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}.content{padding:28px;max-width:1450px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}.welcome h2{font-size:25px;margin:0 0 4px}.welcome p{margin:0;color:var(--muted)}.btn{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:11px 15px;cursor:pointer;font:inherit}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{background:var(--accent2);color:var(--accent);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}.stat strong{display:block;font-size:27px;margin:13px 0 4px}.stat small{color:var(--muted)}.columns{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{padding:20px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h3{font-size:16px;margin:0}.muted{color:var(--muted)}.link{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer}.activity{display:grid;gap:0}.activityrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.activityrow:last-child{border:0}.dot{width:38px;height:38px;border-radius:11px;background:#f0f3f7;display:grid;place-items:center}.activityrow b{display:block;font-size:14px}.activityrow small{color:var(--muted)}.activityrow .right{margin-left:auto;text-align:right;font-weight:700}.badge{display:inline-block;border-radius:30px;padding:4px 9px;background:#fff2d9;color:#8b5c08;font-size:11px;font-weight:700}.badge.green{background:#e2f7ed;color:var(--green)}.badge.red{background:#fde9e9;color:var(--red)}.modulehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.modulehead h2{margin:0 0 4px}.modulehead p{margin:0;color:var(--muted)}.toolbar{display:flex;gap:10px;margin-bottom:15px}.search{width:100%;max-width:360px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font:inherit;outline-color:var(--accent)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600;background:#fafbfc}td b{font-size:13px}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;min-width:0}.field textarea{min-height:80px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{padding:13px 15px;border-radius:10px;background:#fff6e8;color:#78571a;font-size:13px;margin-top:16px}.hidden{display:none!important}.mobilemenu{display:none;border:0;background:white;font-size:22px}.pill{padding:6px 9px;border-radius:8px;background:#f3f5f8;font-size:12px;color:var(--muted)}

.status-picker{border:0;border-radius:18px;padding:0;width:min(440px,calc(100% - 28px));max-width:440px;box-shadow:0 24px 90px #0003;color:var(--ink)}
.status-picker::backdrop{background:#10182080;backdrop-filter:blur(2px)}
.status-picker-head{padding:20px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.status-picker-head h3{margin:0;font-size:18px}.status-picker-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.status-options{padding:12px;display:grid;gap:8px}.status-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer}.status-option:hover,.status-option.selected{border-color:var(--accent);background:var(--accent2)}.status-option.selected{font-weight:750}.status-choice{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#f1f3f5;color:var(--muted);font-weight:800}.status-option.selected .status-choice{background:var(--accent);color:#fff}.status-picker-foot{padding:0 12px 14px;display:flex;justify-content:flex-end}
.payment-picker-title{padding:20px 20px 14px;border-bottom:1px solid var(--line)}.payment-picker-title h3{margin:0;font-size:18px}.payment-picker-title p{margin:4px 0 0;color:var(--muted);font-size:13px}.payment-options{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.payment-option{min-height:58px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:650;cursor:pointer;padding:12px 10px;text-align:center}.payment-option:hover,.payment-option:focus-visible{border-color:var(--accent);background:var(--accent2);outline:none}.payment-picker-foot{padding:0 14px 14px;display:flex;justify-content:flex-end}
@media(max-width:420px){.payment-options{grid-template-columns:1fr}}

@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.content{padding:20px}.top{padding:0 20px}}
@media(max-width:680px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:250px}.side.open{display:flex}.mobilemenu{display:block}.top{height:70px;padding:0 15px}.content{padding:17px 13px}.welcome{align-items:flex-start;flex-direction:column}.welcome h2{font-size:22px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.stat-top{font-size:12px}.stat-icon{width:30px;height:30px}.user .usertext{display:none}.panel{padding:14px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{flex-direction:column}.search{max-width:none}}

<script>

const configs={clientes:{title:'Clientes',singular:'cliente',icon:'♙',fields:[['nome','Nome completo','text',true],['telefone','Telefone / WhatsApp','tel',true],['email','E-mail','email',false],['observacoes','Observações','textarea',false]],cols:[['nome','Cliente'],['telefone','Telefone'],['email','E-mail']]},motos:{title:'Motos',singular:'moto',icon:'🏍',fields:[['placa','Placa','text',true],['marca','Marca','text',true],['modelo','Modelo','text',true],['ano','Ano','number',false],['km','Quilometragem','number',false],['dono','Nome do cliente','text',true]],cols:[['placa','Placa'],['marca','Marca'],['modelo','Modelo'],['dono','Cliente']]},servicos:{title:'Ordens de serviço',singular:'ordem de serviço',icon:'🛠',fields:[['numero','Nº da OS','text',true],['cliente','Cliente','text',true],['moto','Moto / placa','text',true],['descricao','Defeito relatado / serviço','textarea',true],['pecas','Peças do estoque (selecione peça e quantidade)','parts',false],['mao','Mão de obra (R$)','number',false],['status','Status','select',true,['Em andamento','Aguardando peças','Pendente','Concluído']],['pagamento','Status do pagamento','select',true,['Pendente','Pago','Parcial']],['formaPagamento','Forma de pagamento','select',false,['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Outro']],['valorRecebido','Valor recebido (R$)','number',false]],cols:[['numero','OS'],['cliente','Cliente'],['moto','Moto'],['status','Status'],['formaPagamento','Forma de pagamento'],['total','Total']]},estoque:{title:'Estoque',singular:'produto',icon:'▦',fields:[['nome','Nome da peça','text',true],['codigo','Código / referência','text',false],['categoria','Categoria','text',false],['quantidade','Quantidade','number',true],['minimo','Estoque mínimo','number',false],['custo','Custo unitário (R$)','number',false],['preco','Preço de venda (R$)','number',false]],cols:[['nome','Peça'],['codigo','Código'],['quantidade','Qtd.'],['custo','Custo unitário'],['preco','Preço venda']]},vendas:{title:'Vendas',singular:'venda',icon:'🛒',fields:[['data','Data','date',true],['cliente','Cliente (opcional)','text',false],['itens','Produtos / descrição','text',true],['quantidade','Quantidade','number',true],['valor','Valor total (R$)','number',true],['pagamento','Forma de pagamento','select',true,['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','A prazo','Outro']]],cols:[['dataHora','Data e hora'],['cliente','Cliente'],['itens','Descrição'],['quantidade','Qtd.'],['valor','Valor'],['pagamento','Forma de pagamento']]},financeiro:{title:'Financeiro',singular:'lançamento',icon:'▤',fields:[['tipo','Tipo','select',true,['Entrada','Despesa']],['descricao','Descrição','text',true],['categoria','Categoria','text',false],['valor','Valor (R$)','number',true],['data','Data','date',true],['pagamento','Forma de pagamento','select',false,['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Outro']]],cols:[['data','Data'],['tipo','Tipo'],['descricao','Descrição'],['categoria','Categoria'],['valor','Valor']]},caixa:{title:'Fechamento de caixa',singular:'fechamento',icon:'▣',fields:[],cols:[]}};
let data={};Object.keys(configs).forEach(k=>{try{data[k]=JSON.parse(localStorage.getItem('oficina_'+k)||'[]')}catch{data[k]=[]}});let current='inicio';let query='';let directSaleCart=[];
const $=s=>document.querySelector(s);const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const localDateTime=()=>new Date().toISOString();const displaySaleDateTime=v=>v.dataHora?new Date(v.dataHora).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):(v.data?String(v.data).split('-').reverse().join('/'):'—');let financeFocusDate=today();const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(k){localStorage.setItem('oficina_'+k,JSON.stringify(data[k]));autoBackupNow()}function all(k){return data[k]||[]}
function go(page,fromPop=false){if(!pages[page])return;if(!fromPop&&page!==current){history.pushState({oficinaMotoPage:page},'',`#${page}`)}current=page;query='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').textContent=pages[page];$('#crumb').textContent=pages[page].toUpperCase();$('#sidebar').classList.remove('open');render()}
// Permite usar o botão Voltar do Android/navegador para retornar à tela anterior do app.
window.addEventListener('popstate',()=>{const modal=$('#modal');if(modal&&modal.open){modal.close();history.pushState({oficinaMotoPage:current},'',`#${current}`);return;}const target=history.state&&history.state.oficinaMotoPage;if(target&&pages[target]){go(target,true)}else{go('inicio',true);history.pushState({oficinaMotoPage:'inicio'},'','#inicio')}});
function render(){if(current==='inicio')return dashboard();if(current==='financeiro')return listing(current,true);if(current==='caixa')return cashDashboard();listing(current)}
function dashboard(){let low=all('estoque').filter(x=>Number(x.quantidade)<=Number(x.minimo||0));let pending=all('servicos').filter(x=>x.status!=='Concluído');let revenue=all('vendas').reduce((s,x)=>s+Number(x.valor||0),0);let expense=all('financeiro').filter(x=>x.tipo==='Despesa').reduce((s,x)=>s+Number(x.valor||0),0);$('#content').innerHTML=`<div class="welcome premium-hero"><div class="hero-copy"><span class="hero-kicker"><span class="hero-kicker-dot"></span> PAINEL DE CONTROLE</span><h2>Oficina Moto</h2><p>Gestão da oficina, organizada para você trabalhar com agilidade.</p></div><button class="btn hero-cta" onclick="openForm('servicos')"><span class="cta-plus">＋</span> Nova ordem de serviço</button></div><div class="stats"><button type="button" class="stat stat-btn" onclick="go('clientes')" aria-label="Abrir clientes cadastrados"><div class="stat-top">Clientes cadastrados <span class="stat-icon">♙</span></div><strong>${all('clientes').length}</strong><small>Toque para acessar clientes</small></button><button type="button" class="stat stat-btn" onclick="go('servicos')" aria-label="Abrir serviços em aberto"><div class="stat-top">Serviços em aberto <span class="stat-icon">🛠</span></div><strong>${pending.length}</strong><small>Toque para acessar ordens de serviço</small></button><button type="button" class="stat stat-btn" onclick="go('vendas')" aria-label="Abrir vendas registradas"><div class="stat-top">Vendas registradas <span class="stat-icon">🛒</span></div><strong>${money(revenue)}</strong><small>Toque para consultar vendas</small></button><button type="button" class="stat stat-btn" onclick="go('estoque')" aria-label="Abrir itens em estoque"><div class="stat-top">Itens com estoque baixo <span class="stat-icon">▦</span></div><strong>${low.length}</strong><small>Toque para consultar estoque</small></button><button type="button" class="stat stat-btn" onclick="go('vendas')" aria-label="Abrir tela de vendas diretas"><div class="stat-top">Vendas <span class="stat-icon">＋🛍</span></div><strong>Registrar venda</strong><small>Vender peças sem ordem de serviço</small></button></div><div class="columns"><section class="panel"><div class="panelhead"><h3>Ordens de serviço recentes</h3><button class="link" onclick="go('servicos')">Ver todas →</button></div><div class="activity">${all('servicos').slice(-5).reverse().map(x=>`<div class="activityrow"><div class="dot">🛠</div><div><b>${safe(x.numero||'OS')} · ${safe(x.cliente)}</b><small>${safe(x.moto)} · ${safe(x.descricao)}</small></div><div class="right"><div>${money(Number(x.mao||0)+Number(x.pecasvalor||0))}</div><span class="badge ${x.status==='Concluído'?'green':''}">${safe(x.status||'Aguardando')}</span></div></div>`).join('')||'<div class="empty">Nenhuma ordem cadastrada ainda.<br>Crie sua primeira ordem de serviço.</div>'}</div></section><section class="panel"><div class="panelhead"><h3>Acesso rápido</h3><span class="pill">Atalhos</span></div><div class="activity"><div class="activityrow"><div class="dot">♙</div><div><b>Novo cliente</b><small>Cadastre contato e observações</small></div><button class="link" onclick="openForm('clientes')">＋</button></div><div class="activityrow"><div class="dot">🏍</div><div><b>Cadastrar moto</b><small>Placa, modelo e proprietário</small></div><button class="link" onclick="openForm('motos')">＋</button></div><div class="activityrow"><div class="dot">▦</div><div><b>Adicionar peça ao estoque</b><small>Controle quantidade e preço</small></div><button class="link" onclick="openForm('estoque')">＋</button></div><div class="activityrow"><div class="dot">🛒</div><div><b>Registrar venda</b><small>Peças e forma de pagamento</small></div><button class="link" onclick="openForm('vendas')">＋</button></div></div><div class="panel" style="margin-top:16px;border-color:#c9a34a55;background:#191919;color:#f4f1e9"><div class="panelhead"><h3>🛡️ Backup automático</h3><span class="badge green">Ativo</span></div><p style="margin:0 0 12px;color:#c8c2b5;font-size:13px">O aplicativo function listing(key,finance=false){
  const c=configs[key],cols=c.cols;
  const getRows=()=>all(key).filter(x=>{
    const own=Object.values(x).join(' ').toLowerCase();
    if(own.includes(query.toLowerCase()))return true;
    // Na busca de clientes, também permite localizar pelo número da placa de uma moto vinculada pelo nome do proprietário.
    if(key==='clientes'){
      const plates=all('motos').filter(m=>String(m.dono||'').trim().toLowerCase()===String(x.nome||'').trim().toLowerCase()).map(m=>m.placa||'').join(' ').toLowerCase();
      return plates.includes(query.toLowerCase());
    }
    return false;
  });

const AUTO_BACKUP_KEY='oficina_backups_automaticos';
function autoBackupNow(){
  try{
    const snap={app:'Oficina Moto',version:3,savedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data)),caixaAberturas:allCashOpenings()};
    let backups=[];try{backups=JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]')}catch{}
    // Mantém cópias internas recentes; limita o volume para reduzir risco de exceder o espaço do navegador.
    backups.push(snap);backups=backups.slice(-5);
    while(backups.length){try{localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(backups));break}catch(e){backups.shift();}}
  }catch(e){console.warn('Backup automático não pôde ser salvo neste momento.',e)}
}
function getAutoBackups(){try{return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]')}catch{return []}}
function validateBackupPayload(parsed){
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error('Formato inválido');
  if(parsed.app && parsed.app!=='Oficina Moto')throw new Error('Aplicativo incompatível');
  const source=parsed.data||parsed;
  if(!source||typeof source!=='object'||Array.isArray(source))throw new Error('Dados inválidos');
  const keys=Object.keys(configs);
  // Um backup completo deve conter todas as áreas para evitar apagar dados por engano.
  if(!keys.every(k=>Array.isArray(source[k])))throw new Error('Backup incompleto');
  if(parsed.caixaAberturas!==undefined&&!Array.isArray(parsed.caixaAberturas))throw new Error('Dados de caixa inválidos');
  return {source,keys};
}
function saveEmergencySnapshot(){
  const snap={app:'Oficina Moto',version:3,savedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(data)),caixaAberturas:allCashOpenings()};
  localStorage.setItem('oficina_backup_seguranca_pre_restauracao',JSON.stringify(snap));
}
function applyBackup(parsed){
  const {source,keys}=validateBackupPayload(parsed);
  // Guarda cópia recuperável antes de tocar nos dados atuais.
  saveEmergencySnapshot();
  const old={};
  [...keys,'caixaAberturas'].forEach(k=>{const storageKey=k==='caixaAberturas'?'oficina_caixaAberturas':'oficina_'+k;old[storageKey]=localStorage.getItem(storageKey)});
  try{
    keys.forEach(k=>localStorage.setItem('oficina_'+k,JSON.stringify(source[k])));
    if(Array.isArray(parsed.caixaAberturas))localStorage.setItem('oficina_caixaAberturas',JSON.stringify(parsed.caixaAberturas));
    keys.forEach(k=>{data[k]=source[k]});
  }catch(err){
    Object.entries(old).forEach(([key,value])=>{try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch{}});
    throw err;
  }
}
function restoreAutoBackup(){
  const backups=getAutoBackups();if(!backups.length){alert('Ainda não existe uma cópia automática para restaurar.');return;}
  const snap=backups[backups.length-1];const when=snap.savedAt?new Date(snap.savedAt).toLocaleString('pt-BR'):'data não informada';
  if(!confirm('Restaurar a cópia automática de '+when+'? Antes, será criada uma cópia de segurança dos dados atuais.'))return;
  try{applyBackup(snap);autoBackupNow();alert('Cópia automática restaurada.');go('inicio')}
  catch(e){alert('Não foi possível restaurar a cópia. Os dados anteriores foram preservados sempre que o navegador permitiu. Verifique o espaço disponível no aparelho.');}
}

function importBackup(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  if(file.size>10*1024*1024){alert('O arquivo é maior que 10 MB. Selecione um backup válido do Oficina Moto.');event.target.value='';return;}
  const reader=new FileReader();reader.onload=()=>{try{
    const parsed=JSON.parse(reader.result);validateBackupPayload(parsed);
    if(!confirm('O backup foi validado. Restaurá-lo substituirá os dados atuais. Antes, o aplicativo criará uma cópia de segurança local dos dados atuais. Deseja continuar?')){event.target.value='';return;}
    applyBackup(parsed);autoBackupNow();alert('Backup restaurado com sucesso.');go('inicio');
  }catch(e){alert('Não foi possível restaurar: o arquivo pode estar incompleto, ser incompatível ou faltar espaço no armazenamento. Nenhum dado será importado de um arquivo inválido.');}event.target.value='';};reader.onerror=()=>{alert('Não foi possível ler o arquivo de backup.');event.target.value='';};reader.readAsText(file);
}

function deductPartsForService(service){
  if(service.estoqueBaixado || !Array.isArray(service.itensEstoque) || !service.itensEstoque.length)return true;
  const totals={}; for(const item of service.itensEstoque)totals[item.productId]=(totals[item.productId]||0)+Number(item.quantidade||0);
  for(const [id,qty] of Object.entries(totals)){const product=all('estoque').find(p=>Number(p.id)===Number(id));if(!product){alert('Uma peça vinculada a esta OS não foi encontrada no estoque. A finalização foi cancelada.');return false;}if(Number(product.quantidade||0)<qty){alert(`Estoque insuficiente para ${product.nome}. Disponível: ${product.quantidade}; necessário: ${qty}. A OS não foi finalizada.`);return false;}}
  for(const [id,qty] of Object.entries(totals)){const product=all('estoque').find(p=>Number(p.id)===Number(id));product.quantidade=Number(product.quantidade||0)-qty;}
  save('estoque');service.estoqueBaixado=true;service.estoqueBaixadoEm=new Date().toISOString();return true;
}
function syncServiceSale(service){
  const sales=all('vendas');
  const existing=sales.find(v=>Number(v.osId)===Number(service.id));
  // Vendas e OS são integradas: basta o pagamento estar marcado como Pago
  // ou a OS estar Concluída. O osId garante atualização do mesmo lançamento, sem duplicatas.
  const qualifies=service.pagamento==='Pago'||service.status==='Concluído';
  if(!qualifies){
    if(existing){data.vendas=sales.filter(v=>Number(v.osId)!==Number(service.id));save('vendas');}
    return;
  }
  const total=Math.max(0,Number(service.total??(Number(service.mao||0)+Number(service.pecasvalor||0))));
  const saleDate=service.dataConclusao||service.dataPagamento||today();
  const sale={id:existing?existing.id:Date.now()+Number(service.id)%1000,osId:service.id,data:saleDate,dataHora:existing?.dataHora||localDateTime(),cliente:service.cliente||'',itens:`OS ${service.numero||service.id} · ${service.moto||''} · ${service.descricao||'Serviço'}`,quantidade:1,valor:total,pagamento:service.formaPagamento||'A definir',statusRecebimento:'Pago',valorRecebido:total};
  if(existing)Object.assign(existing,sale);else data.vendas.push(sale);
  save('vendas');
}

function showServicePaymentPicker(id,normalized){

  const dlg=document.createElement('dialog');dlg.className='status-picker';
  dlg.innerHTML=`<div class="payment-picker-title"><h3>Forma de pagamento</h3><p>Selecione como o cliente pagou a OS ${safe((all('servicos').find(x=>Number(x.id)===Number(id))||{}).numero||'')}.</p></div><div class="payment-options">${methods.map(method=>`<button type="button" class="payment-option" data-payment="${safe(method)}">${safe(method)}</button>`).join('')}</div><div class="payment-picker-foot"><button type="button" class="btn secondary" data-cancel>Cancelar</button></div>`;

function applyServiceStatus(id,normalized){
  const service=all('servicos').find(x=>Number(x.id)===Number(id));if(!service)return;
  const willFinal=normalized==='Concluído';
  if(willFinal){
    const total=Math.max(0,Number(service.total??(Number(service.mao||0)+Number(service.pecasvalor||0))));
    let received=service.pagamento==='Pago'?total:Math.max(0,Number(service.valorRecebido||0));
    if(!service.formaPagamento||service.formaPagamento==='A definir'){
      showServicePaymentPicker(id,normalized);return;
    }
    if(service.pagamento!=='Pago'){
      const amount=prompt(`Valor recebido do cliente (R$). Total da OS: ${money(total)}`,String(received||0).replace('.',','));
      if(amount===null)return;
      received=Number(String(amount).trim().replace(/\s/g,'').replace(',','.'));
      if(!Number.isFinite(received)||received<0||received>total){alert(`Informe um valor válido entre R$ 0,00 e ${money(total)}.`);return;}
    }
    service.valorRecebido=received;
    if(received+0.005<total){
      service.status='Pendente';
      service.pagamento=received>0?'Parcial':'Pendente';
      service.dataConclusao=null;
      syncServiceSale(service);
      save('servicos');save('estoque');render();
      alert(`A OS ficou Pendente porque o pagamento ainda não foi completo.\nRecebido: ${money(received)}\nFalta pagar: ${money(total-received)}.`);
      return;
    }
    service.pagamento='Pago';service.valorRecebido=total;service.dataPagamento=service.dataPagamento||today();
    if(!service.estoqueBaixado&&Array.isArray(service.itensEstoque)&&service.itensEstoque.length&&!deductPartsForService(service))return;
    service.dataConclusao=service.dataConclusao||today();service.status='Concluído';syncServiceSale(service);
  }else{
    service.status=normalized;
    syncServiceSale(service);
  }
  save('servicos');save('estoque');render();
}

function salesPaymentSummary(date=today()){
  const sales=all('vendas').filter(v=>v.data===date);
  const receivedOf=v=>Math.max(0,Number((v.valorRecebido ?? (v.statusRecebimento==='Pendente'?0:v.valor))||0));
  const labels=[['Pix',['pix']],['Dinheiro',['dinheiro']],['Crédito',['cartão de crédito','credito','crédito']],['Débito',['cartão de débito','debito','débito']]];
  const totals={};
  for(const [label] of labels)totals[label]=0;
  sales.forEach(v=>{
    const method=String(v.pagamento||'A definir').trim().toLocaleLowerCase('pt-BR');
    let label=null;
    if(method==='pix')label='Pix';
    else if(method==='dinheiro')label='Dinheiro';
    else if(method.includes('crédito')||method.includes('credito'))label='Crédito';
    else if(method.includes('débito')||method.includes('debito'))label='Débito';
    if(label)totals[label]+=receivedOf(v);
  });

  const panel=$('#content .panel');if(!panel)return;

  summary.innerHTML=`<div class="panelhead"><div><h3>Resumo financeiro mensal</h3><p class="muted" style="margin:4px 0 0">Somente dias com fechamento de caixa registrado.</p></div><input id="financeMonth" type="month" value="${key}" onchange="renderFinanceMonth(this.value)" style="max-width:180px"></div><div class="stats" style="margin:0 0 14px"><div class="stat"><div class="stat-top">Total recebido</div><strong>${money(recebido)}</strong><small>${records.length} dia(s) fechado(s)</small></div><div class="stat"><div class="stat-top">Despesas</div><strong>${money(despesas)}</strong><small>Nos dias fechados</small></div><div class="stat"><div class="stat-top">Saldo do mês</div><strong>${money(saldo)}</strong><small>Recebido menos despesas</small></div></div><div class="tablewrap"><table><thead><tr><th>Dia</th><th>Vendas</th><th>Recebido</th><th>Despesas</th><th>Saldo</th></tr></thead><tbody>${records.map(x=>`<tr><td>${String(x.data).split('-').reverse().join('/')}</td><td>${Number(x.quantidade||0)}</td><td>${money(x.recebido)}</td><td>${money(x.despesas)}</td><td>${money(x.saldo??(Number(x.recebido||0)-Number(x.despesas||0)))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum fechamento registrado neste mês.</td></tr>'}</tbody></table></div><p class="muted" style="margin:10px 0 0;font-size:12px">Os fechamentos ficam salvos neste aparelho e alimentam automaticamente este resumo mensal.</p>`;
}
function cashDashboard(){
  const date=today();const closed=all('caixa').slice().sort((a,b)=>b.data.localeCompare(a.data));
  const sales=all('vendas').filter(v=>v.data===date);const received=sales.reduce((sum,v)=>sum+Math.max(0,Number((v.valorRecebido ?? (v.statusRecebimento==='Pendente'?0:v.valor))||0)),0);const expenses=all('financeiro').filter(x=>x.tipo==='Despesa'&&x.data===date).reduce((sum,x)=>sum+Number(x.valor||0),0);const opening=cashOpening(date);const dayClosed=all('caixa').some(x=>x.data===date);
  const openPanel=dayClosed?`<span class="badge green">Caixa fechado</span>`:opening?`<span class="badge">Caixa aberto</span><p class="muted" style="margin:8px 0 0">Aberto em ${new Date(opening.abertoEm).toLocaleString('pt-BR')} · Fundo inicial: <b>${money(opening.valorInicial)}</b></p>`:`<div class="field" style="margin:0;min-width:200px"><label for="openingAmount">Dinheiro inicial no caixa (R$)</label><input id="openingAmount" type="number" min="0" step="0.01" value="0" placeholder="0,00"></div><button class="btn" onclick="openCashFromPage()">＋ Abrir caixa agora</button>`;
  $('#content').innerHTML=`<div class="modulehead"><div><h2>Caixa da oficina</h2><p>Abra o caixa ao iniciar o expediente, mesmo antes da primeira venda. No fim do dia, registre o fechamento para alimentar o Financeiro.</p></div><button class="btn secondary" onclick="go('vendas')">← Voltar para Vendas</button></div><section class="panel"><div class="panelhead"><h3>Abertura e fechamento do dia</h3><span class="badge ${dayClosed?'green':''}">${dayClosed?'Fechado':opening?'Aberto':'Não aberto'}</span></div><div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div class="field" style="margin:0;min-width:180px"><label for="cashDate">Data do caixa</label><input id="cashDate" type="date" value="${date}" onchange="cashDateChanged(this.value)"></div>${openPanel}<button class="btn" onclick="closeCashFromPage()">${dayClosed?'Atualizar fechamento':'Fechar caixa do dia'}</button></div><div class="stats" style="margin-top:18px"><div class="stat"><div class="stat-top">Vendas do dia</div><strong>${sales.length}</strong></div><div class="stat"><div class="stat-top">Valor recebido</div><strong>${money(received)}</strong></div><div class="stat"><div class="stat-top">Despesas</div><strong>${money(expenses)}</strong></div><div class="stat"><div class="stat-top">Saldo previsto</div><strong>${money(received-expenses)}</strong></div></div><p class="muted" style="font-size:12px">A abertura fica registrada separadamente do faturamento. O dinheiro inicial não é contado como venda ou entrada financeira.</p></section><section class="panel" style="margin-top:16px"><div class="panelhead"><h3>Fechamentos salvos</h3><span class="pill">${closed.length} dia(s)</span></div><div class="tablewrap"><table><thead><tr><th>Dia</th><th>Vendas</th><th>Recebido</th><th>Despesas</th><th>Saldo</th></tr></thead><tbody>${closed.map(x=>`<tr><td>${String(x.data).split('-').reverse().join('/')}</td><td>${Number(x.quantidade||0)}</td><td>${money(x.recebido)}</td><td>${money(x.despesas)}</td><td>${money(x.saldo??(Number(x.recebido||0)-Number(x.despesas||0)))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum caixa fechado ainda.</td></tr>'}</tbody></table></div></section>`;
}
function closeCashFromPage(){const input=$('#cashDate');const date=input&&input.value?input.value:today();const saved=closeCash(date);if(saved){financeFocusDate=date;go('financeiro');}}
function cashDateChanged(value){const input=$('#cashDate');if(input)input.value=value;const sales=all('vendas').filter(v=>v.data===value);const received=sales.reduce((sum,v)=>sum+Math.max(0,Number((v.valorRecebido ?? (v.statusRecebimento==='Pendente'?0:v.valor))||0)),0);const expenses=all('financeiro').filter(x=>x.tipo==='Despesa'&&x.data===value).reduce((sum,x)=>sum+Number(x.valor||0),0);const stats=$('#content .stats');if(stats)stats.innerHTML=`<div class="stat"><div class="stat-top">Vendas do dia</div><strong>${sales.length}</strong></div><div class="stat"><div class="stat-top">Valor recebido</div><strong>${money(received)}</strong></div><div class="stat"><div class="stat-top">Despesas</div><strong>${money(expenses)}</strong></div><div class="stat"><div class="stat-top">Saldo previsto</div><strong>${money(received-expenses)}</strong></div>`;}
function closeCash(date){
  if(!date){alert('Escolha a data para fechar o caixa.');return;}
  const details=dailyCashDetails(date);
  const opening=cashOpening(date);const item={id:Date.now(),data:date,abertura:opening?{valorInicial:opening.valorInicial,abertoEm:opening.abertoEm}:null,recebido:details.recebido,valorVendido:details.sales.reduce((sum,v)=>sum+Number(v.valor||0),0),despesas:details.saidas,saldo:details.saldo,quantidade:details.sales.length,formasPagamento:details.formas,detalheDespesas:details.expenses.map(x=>({descricao:x.descricao||x.categoria||'Despesa',categoria:x.categoria||'',pagamento:x.pagamento||'Não informado',valor:Number(x.valor||0)})),fechadoEm:new Date().toISOString()};
  const old=all('caixa').find(x=>x.data===date);if(old){if(!confirm('Já existe um fechamento para esse dia. Deseja atualizar os valores salvos?'))return false;Object.assign(old,item);}else data.caixa.push(item);
  save('caixa');const openings=allCashOpenings();const opened=openings.find(x=>x.data===date);if(opened){opened.status='fechado';opened.fechadoEm=new Date().toISOString();saveCashOpenings(openings);}alert('Fechamento de caixa registrado para '+date.split('-').reverse().join('/')+'. O resumo detalhado será exibido no Financeiro.');
  if(current==='caixa')cashDashboard();else if(current==='financeiro')render();return true;
}

function updateServiceTotalPreview(){
  const form=$('#recordForm');if(!form||form.dataset.key!=='servicos')return;
  let partsTotal=0;
  document.querySelectorAll('#partsRows .part-row').forEach(row=>{const id=Number(row.querySelector('.part-product')?.value||0);const qty=Number(row.querySelector('.part-qty')?.value||0);const product=all('estoque').find(p=>Number(p.id)===id);if(product&&Number.isFinite(qty)&&qty>0)partsTotal+=Number(product.preco||0)*qty;});
  const labor=Math.max(0,Number(form.elements.mao?.value||0));
  const total=partsTotal+labor;
  const partsEl=$('#previewPartsTotal'),laborEl=$('#previewLaborTotal'),totalEl=$('#previewServiceTotal');
  if(partsEl)partsEl.textContent=money(partsTotal);if(laborEl)laborEl.textContent=money(labor);if(totalEl)totalEl.textContent=money(total);
}
function openForm(key){let c=configs[key];$('#modalTitle').textContent='Novo '+c.singular;$('#formFields').innerHTML=c.fields.filter(f=>!(key==='servicos'&&f[0]==='pecasvalor')).map(f=>{let [name,label,type,required,opts]=f;let control;if(type==='parts'){control=servicePartsMarkup();}else if(key==='servicos'&&name==='cliente'){let clients=all('clientes');control=`<select name="cliente" ${required?'required':''}><option value="">${clients.length?'Selecione um cliente...':'Nenhum cliente cadastrado — cadastre em Clientes primeiro'}</option>${clients.map(x=>`<option value="${safe(x.nome)}">${safe(x.nome)}${x.telefone?' — '+safe(x.telefone):''}</option>`).join('')}</select>`;}else if(type==='select'){control=`<select name="${name}" ${required?'required':''}><option value="">Selecione...</option>${opts.map(o=>`<option>${safe(o)}</option>`).join('')}</select>`;}else if(type==='textarea'){control=`<textarea name="${name}" ${required?'required':''}></textarea>`;}else{control=`<input name="${name}" type="${type}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''} ${name==='data'?'value="'+today()+'"':''}>`;}const totalPreview=key==='servicos'&&name==='valorRecebido'?`<div id="serviceTotalPreview" class="field full" style="padding:14px;border:1px solid #9b7a32;border-radius:12px;background:linear-gradient(135deg,#191919,#242016);color:#f6e8bd;margin:4px 0 10px"><div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:7px"><span>Subtotal das peças</span><strong id="previewPartsTotal">R$ 0,00</strong></div><div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:10px"><span>Mão de obra</span><strong id="previewLaborTotal">R$ 0,00</strong></div><div style="height:1px;background:#65552f;margin-bottom:10px"></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span style="font-weight:700">TOTAL DA ORDEM DE SERVIÇO</span><strong id="previewServiceTotal" style="font-size:1.25rem;color:#e8c15d">R$ 0,00</strong></div></div>`:'';return totalPreview+`<div class="field ${type==='textarea'||type==='parts'?'full':''}"><label>${label}${required?' *':''}</label>${control}${key==='servicos'&&name==='cliente'&&!all('clientes').length?'<small class="muted">Abra Clientes e cadastre pelo menos um cliente antes de criar a OS.</small>':''}</div>`}).join('');$('#recordForm').dataset.key=key;$('#modal').showModal();if(key==='servicos')updateServiceTotalPreview()}
function closeModal(){$('#modal').close()}$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#mobilemenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#recordForm').addEventListener('input',e=>{if(e.currentTarget.dataset.key==='servicos')updateServiceTotalPreview()});$('#recordForm').addEventListener('change',e=>{if(e.currentTarget.dataset.key==='servicos')updateServiceTotalPreview()});
$('#recordForm').addEventListener('submit',e=>{e.preventDefault();let key=e.currentTarget.dataset.key;let fd=new FormData(e.currentTarget),obj={id:Date.now()};for(let [k,v] of fd.entries())obj[k]=String(v).trim();if(key==='servicos'){obj.mao=Number(obj.mao||0);obj.valorRecebido=Number(obj.valorRecebido||0);try{obj.itensEstoque=getSelectedParts()}catch(err){alert(err.message);return;}obj.pecas=obj.itensEstoque.map(p=>`${p.quantidade}x ${p.nome}`).join(', ');obj.pecasvalor=obj.itensEstoque.reduce((s,p)=>s+p.subtotal,0);obj.total=Number(obj.mao||0)+obj.pecasvalor;obj.estoqueBaixado=false;const methods=['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Transferência','Outro'];if(obj.status==='Concluído'){if(!obj.formaPagamento){const method=prompt('Forma de pagamento da OS:\n'+methods.join(' / '),'Pix');if(method===null)return;const chosen=methods.find(m=>m.toLowerCase()===method.trim().toLowerCase());if(!chosen){alert('Forma de pagamento inválida.');return;}obj.formaPagamento=chosen;}if(obj.pagamento==='Pago')obj.valorRecebido=obj.total;else if(obj.valorRecebido<=0&&obj.pagamento==='Parcial'){const amount=prompt(`Valor recebido (R$). Total da OS: ${money(obj.total)}`,'0');if(amount===null)return;obj.valorRecebido=Number(String(amount).trim().replace(',','.'));}if(!Number.isFinite(obj.valorRecebido)||obj.valorRecebido<0||obj.valorRecebido>obj.total){alert('Valor recebido inválido.');return;}if(obj.valorRecebido+0.005<obj.total){obj.status='Pendente';obj.pagamento=obj.valorRecebido>0?'Parcial':'Pendente';obj.dataConclusao=null;}else{obj.pagamento='Pago';obj.valorRecebido=obj.total;if(obj.itensEstoque.length&&!deductPartsForService(obj))return;obj.dataConclusao=today();}}else if(obj.pagamento==='Pago'){obj.valorRecebido=obj.total;obj.dataPagamento=today();}else if(obj.valorRecebido>0){obj.pagamento=obj.valorRecebido>=obj.total?'Pago':'Parcial';}else{obj.pagamento='Pendente';}if(obj.pagamento==='Pago')obj.dataPagamento=today();syncServiceSale(obj);}if(key==='estoque'){obj.quantidade=Number(obj.quantidade||0);obj.minimo=Number(obj.minimo||0);obj.custo=Number(obj.custo||0);obj.preco=Number(obj.preco||0)}if(key==='vendas'){obj.quantidade=Number(obj.quantidade||0);obj.valor=Number(obj.valor||0);obj.dataHora=localDateTime();obj.valorRecebido=obj.valor;obj.statusRecebimento='Pago'}if(key==='financeiro')obj.valor=Number(obj.valor||0);data[key].push(obj);save(key);if(key==='servicos')save('estoque');closeModal();go(key)});
function editStockField(button,id,field){
  const allowed={codigo:{label:'Código / referência',type:'text'},quantidade:{label:'Quantidade',type:'number'},custo:{label:'Custo unitário (R$)',type:'number'},preco:{label:'Preço de venda (R$)',type:'number'}};
  if(!allowed[field])return;
  const product=all('estoque').find(p=>Number(p.id)===Number(id));if(!product)return;
  const cell=button.closest('td');if(!cell)return;
  const cfg=allowed[field],original=product[field]??'';
  const inputValue=String(original).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  cell.innerHTML=`<div style="display:flex;align-items:center;gap:5px;min-width:150px;flex-wrap:wrap"><input id="stock-edit-${Number(id)}-${field}" aria-label="${cfg.label}" type="${cfg.type}" ${field==='quantidade'?'min="0" step="1"':' '}${['preco','custo'].includes(field)?'min="0" step="0.01"':''} value="${inputValue}" style="width:100px;max-width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;font:inherit"><button type="button" class="btn" style="padding:6px 9px" onclick="saveStockField(${Number(id)},'${field}')">OK</button><button type="button" class="btn secondary" style="padding:6px 9px" onclick="render()">Cancelar</button></div>`;
  const input=cell.querySelector('input');input.focus();if(input.type==='text')input.select();
}
function saveStockField(id,field){
  const product=all('estoque').find(p=>Number(p.id)===Number(id));const input=document.getElementById(`stock-edit-${Number(id)}-${field}`);if(!product||!input)return;
  let value=input.value.trim();
  if(field==='codigo'){product.codigo=value;}
  else {value=Number(String(value).replace(',','.'));if(!Number.isFinite(value)||value<0||(field==='quantidade'&&!Number.isInteger(value))){alert(field==='quantidade'?'Informe uma quantidade inteira igual ou maior que zero.':'Informe um valor válido igual ou maior que zero.');input.focus();return;}product[field]=value;}
  save('estoque');render();
}

function removeRecord(key,id){if(confirm('Deseja excluir este registro?')){data[key]=data[key].filter(x=>x.id!==id);save(key);render()}}window.go=go;window.openForm=openForm;window.removeRecord=removeRecord;window.editStockField=editStockField;window.saveStockField=saveStockField;window.addPartRow=addPartRow;window.changeServiceStatus=changeServiceStatus;window.cashDateChanged=cashDateChanged;window.closeCash=closeCash;window.closeCashFromSales=closeCashFromSales;window.closeCashFromPage=closeCashFromPage;window.openCashFromSales=openCashFromSales;window.openCashFromPage=openCashFromPage;window.salesCashDateChanged=salesCashDateChanged;window.renderFinanceMonth=renderFinanceMonth;window.showFinanceDay=showFinanceDay;if(!history.state||!history.state.oficinaMotoPage)history.replaceState({oficinaMotoPage:'inicio'},'','#inicio');if(!getAutoBackups().length)autoBackupNow();
go('inicio');
